version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-base
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - NEXUX_ALLOWED_ORIGINS=http://localhost:3000
      - NEXUX_API_KEY=${NEXUX_API_KEY:-}
      - NEXUX_DB_PATH=/data/nexux_jobs.db
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - NEXUX_AI_ENABLED=0
    volumes:
      - nexux-data:/data
      - nexux-output:/app/backend/output
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  nexux-data:
  nexux-output:
