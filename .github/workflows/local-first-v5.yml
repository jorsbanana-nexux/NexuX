name: NexuX Local-First V5

on:
  pull_request:
    paths:
      - "nexus-clipper/local-first-v5/**"
      - ".github/workflows/local-first-v5.yml"
  workflow_dispatch:

concurrency:
  group: local-first-v5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install local-first V5 dependencies
        working-directory: nexus-clipper/local-first-v5
        run: python -m pip install -r requirements-local.txt pytest
      - name: Compile all V5 modules
        working-directory: nexus-clipper/local-first-v5
        run: python -m compileall -q .
      - name: Run deterministic tests
        working-directory: nexus-clipper/local-first-v5
        run: python -m pytest -q
      - name: Run local quality gate
        working-directory: nexus-clipper/local-first-v5
        run: python quality_gate.py
