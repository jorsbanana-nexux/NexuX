name: NexuX Local-First V5

on:
  push:
    branches: [main]
    paths:
      - "nexus-clipper/local-first-v5/**"
      - "nexus-clipper/backend/**"
      - "nexus-clipper/frontend/**"
      - "nexus-clipper/frontend-contract/**"
      - "nexus-clipper/run_nexus.*"
      - ".github/workflows/local-first-v5.yml"
  pull_request:
    paths:
      - "nexus-clipper/local-first-v5/**"
      - "nexus-clipper/backend/**"
      - "nexus-clipper/frontend/**"
      - "nexus-clipper/frontend-contract/**"
      - "nexus-clipper/run_nexus.*"
      - ".github/workflows/local-first-v5.yml"
  workflow_dispatch:

concurrency:
  group: local-first-v5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install local-first V5 + backend dependencies
        working-directory: nexus-clipper
        run: |
          python -m pip install -r local-first-v5/requirements-local.txt pytest
          # backend main.py imports require these (not covered by the legacy req file)
          python -m pip install pydantic pydantic-settings
      - name: Verify canonical backend + legacy shim import cleanly
        run: |
          # Canonical API must import from nexus-clipper/backend with its own deps
          cd nexus-clipper/backend
          python -m py_compile main.py
          python -c "from main import app; assert app.title == 'NexuX Local-First Canonical'"
          cd ../../
          # Legacy shim must import (from backend dir / backend/main.py app re-exported, or stub 410 app)
          cd nexus-clipper/local-first-v5
          python -m py_compile canonical_api.py server.py app.py
          python -c "from canonical_api import app as legacy_app; t = getattr(legacy_app, 'title', ''); assert 'DEPRECATED' in t or t == 'NexuX Local-First Canonical', 'unexpected title: ' + t"
          cd ../../
      - name: Compile V5 modules
        working-directory: nexus-clipper/local-first-v5
        run: python -m compileall -q .
      - name: Compile legacy backend and root builder
        run: python -m compileall -q nexus-clipper/backend && python -m py_compile build_nexus.py
      - name: Validate frontend contract presence
        run: test -s nexus-clipper/frontend-contract/nexuxApi.ts
      - name: Run deterministic V5 tests
        working-directory: nexus-clipper/local-first-v5
        run: python -m pytest -q
      - name: Run local V5 quality gate
        working-directory: nexus-clipper/local-first-v5
        run: python quality_gate.py
      - name: Install frontend dependencies
        working-directory: nexus-clipper/frontend
        run: npm ci
      - name: Build frontend
        working-directory: nexus-clipper/frontend
        run: npm run build
