name: NexuX Local-First V5

on:
  push:
    branches: [main]
    paths:
      - "nexus-clipper/local-first-v5/**"
      - "nexus-clipper/backend/**"
      - "nexus-clipper/frontend/**"
      - "nexus-clipper/run_nexus.*"
      - ".github/workflows/local-first-v5.yml"
  pull_request:
    paths:
      - "nexus-clipper/local-first-v5/**"
      - "nexus-clipper/backend/**"
      - "nexus-clipper/frontend/**"
      - "nexus-clipper/run_nexus.*"
      - ".github/workflows/local-first-v5.yml"
  workflow_dispatch:

concurrency:
  group: local-first-v5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install local-first V5 dependencies
        working-directory: nexus-clipper/local-first-v5
        run: python -m pip install -r requirements-local.txt pytest
      - name: Verify checked-out server source
        working-directory: nexus-clipper/local-first-v5
        run: |
          echo "--- server.py lines 350-370 ---"
          nl -ba server.py | sed -n '350,370p'
          echo "--- server.py syntax check ---"
          python -m py_compile server.py
      - name: Compile V5 modules
        working-directory: nexus-clipper/local-first-v5
        run: python -m compileall -q .
      - name: Compile legacy backend and root builder
        run: python -m compileall -q nexus-clipper/backend && python -m py_compile build_nexus.py
      - name: Run deterministic V5 tests
        working-directory: nexus-clipper/local-first-v5
        run: python -m pytest -q
      - name: Run local V5 quality gate
        working-directory: nexus-clipper/local-first-v5
        run: python quality_gate.py
      - name: Install frontend dependencies
        working-directory: nexus-clipper/frontend
        run: npm ci
      - name: Build frontend
        working-directory: nexus-clipper/frontend
        run: npm run build
